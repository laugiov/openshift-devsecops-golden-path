# OpenShift-specific Helm values
# Use with: helm upgrade --install demo-service gitops/apps/demo-service -f gitops/openshift/values-openshift.yaml

# Enable OpenShift-specific features
openshift:
  enabled: true

# Disable Kubernetes Ingress, use Route instead
ingress:
  enabled: false

# OpenShift Route configuration
route:
  enabled: true
  host: ""  # Leave empty for auto-generated host
  path: /
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations: {}

# Security context compatible with OpenShift restricted SCC
# IMPORTANT: Do NOT set runAsUser - OpenShift assigns arbitrary UID
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  # Do NOT set:
  # - runAsUser (OpenShift assigns)
  # - runAsGroup (OpenShift assigns)

# Service Account
serviceAccount:
  create: true
  annotations: {}
  # For pulling from external registries:
  # imagePullSecrets:
  #   - name: registry-credentials

# Resource limits (required for quota enforcement)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Probes compatible with read-only filesystem
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Volume mounts for writable directories (since rootFS is read-only)
extraVolumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /app/.cache

# Pod disruption budget for HA
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Topology spread for zone distribution
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: demo-service
