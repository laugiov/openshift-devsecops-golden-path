apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-service-prod

resources:
  - ../../base
  - pdb.yaml

commonLabels:
  environment: prod

patches:
  # Production replicas (HA)
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: demo-service

  # Production resources
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    target:
      kind: Deployment
      name: demo-service

  # Update namespace in all resources
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: demo-service-prod
    target:
      kind: Deployment
      name: demo-service
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: demo-service-prod
    target:
      kind: Service
      name: demo-service
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: demo-service-prod
    target:
      kind: Route
      name: demo-service
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: demo-service-prod
    target:
      kind: ServiceAccount
      name: demo-service

configMapGenerator:
  - name: demo-service-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - NODE_ENV=production

images:
  - name: registry.example.com/demo-service
    newName: registry.example.com/demo-service
    digest: sha256:placeholder-prod
