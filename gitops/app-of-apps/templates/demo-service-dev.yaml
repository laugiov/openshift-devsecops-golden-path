apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-service-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision | default "HEAD" }}
    path: gitops/apps/demo-service
    helm:
      valueFiles:
        - ../../env/dev/values-demo-service.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
