# Kind cluster configuration for local GitOps testing
#
# Usage:
#   kind create cluster --config kind-config.yaml --name golden-path
#
# This creates a cluster with:
#   - 1 control plane node
#   - 2 worker nodes (for realistic scheduling)
#   - Ingress-ready configuration
#   - Local registry access

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: golden-path

nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort range for services
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP

  # Worker nodes
  - role: worker
  - role: worker

# Configure containerd to use local registry
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://host.docker.internal:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."host.docker.internal:5000".tls]
      insecure_skip_verify = true

networking:
  # Use default CNI
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/12"
