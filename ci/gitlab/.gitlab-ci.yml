# Golden Path GitLab CI Pipeline
#
# This pipeline provides PARITY with Jenkins shared library controls.
# Same scripts, same gates, same outputs.
#
# Usage: Copy this file to your repository root as .gitlab-ci.yml
#
# Variables to configure in GitLab CI/CD Settings:
#   REGISTRY_URL        - Container registry URL
#   REGISTRY_USER       - Registry username
#   REGISTRY_PASSWORD   - Registry password (masked)
#   COSIGN_KEY          - Cosign private key (file variable)
#   COSIGN_PASSWORD     - Cosign key password (masked)
#   GITOPS_SSH_KEY      - SSH key for GitOps repo (file variable)

stages:
  - build
  - test
  - security
  - quality
  - package
  - sign
  - publish
  - deploy

variables:
  # Application
  APP_NAME: demo-service
  BUILD_TOOL: node

  # Registry (override in CI/CD settings)
  REGISTRY_URL: ${CI_REGISTRY}
  IMAGE_NAME: ${REGISTRY_URL}/${CI_PROJECT_PATH}/${APP_NAME}

  # Security scan thresholds
  FAIL_ON_CRITICAL: "true"
  FAIL_ON_HIGH: "true"
  SEVERITY_THRESHOLD: "CRITICAL,HIGH"

  # Artifacts
  REPORTS_DIR: reports

  # Docker
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_DRIVER: overlay2

# Reusable job templates
.node_job:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - ${APP_NAME}/node_modules/

.docker_job:
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker info

.security_job:
  stage: security
  artifacts:
    paths:
      - ${REPORTS_DIR}/
    reports:
      sast: ${REPORTS_DIR}/gl-sast-report.json
    expire_in: 30 days
  allow_failure: false

# ===========================================================================
# Build Stage
# ===========================================================================
build:
  extends: .node_job
  stage: build
  script:
    - cd ${APP_NAME}
    - npm ci --prefer-offline
    - npm run build --if-present
  artifacts:
    paths:
      - ${APP_NAME}/node_modules/
      - ${APP_NAME}/dist/
    expire_in: 1 hour

# ===========================================================================
# Test Stage
# ===========================================================================
test:unit:
  extends: .node_job
  stage: test
  needs: [build]
  script:
    - cd ${APP_NAME}
    - npm test -- --coverage --ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - ${APP_NAME}/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${APP_NAME}/coverage/cobertura-coverage.xml
    expire_in: 7 days

test:lint:
  extends: .node_job
  stage: test
  needs: [build]
  script:
    - cd ${APP_NAME}
    - npm run lint

# ===========================================================================
# Security Stage - SAST, SCA, Secrets
# ===========================================================================
security:sast:
  extends: .security_job
  image: returntocorp/semgrep:latest
  needs: []
  script:
    - mkdir -p ${REPORTS_DIR}
    - |
      semgrep scan \
        --config auto \
        --json \
        --output ${REPORTS_DIR}/sast-semgrep.json \
        ${APP_NAME}/src || true
    # Convert to GitLab SAST format
    - |
      if [ -f ${REPORTS_DIR}/sast-semgrep.json ]; then
        jq '{
          "version": "15.0.0",
          "vulnerabilities": [.results[] | {
            "id": .check_id,
            "category": "sast",
            "name": .check_id,
            "message": .extra.message,
            "severity": (if .extra.severity == "ERROR" then "Critical" elif .extra.severity == "WARNING" then "Medium" else "Low" end),
            "location": {
              "file": .path,
              "start_line": .start.line,
              "end_line": .end.line
            }
          }]
        }' ${REPORTS_DIR}/sast-semgrep.json > ${REPORTS_DIR}/gl-sast-report.json
      fi
    # Gate decision
    - |
      HIGH_COUNT=$(jq '[.results[] | select(.extra.severity == "ERROR" or .extra.severity == "HIGH")] | length' ${REPORTS_DIR}/sast-semgrep.json 2>/dev/null || echo "0")
      echo "SAST High/Critical findings: ${HIGH_COUNT}"
      if [ "${FAIL_ON_HIGH}" = "true" ] && [ "${HIGH_COUNT}" -gt 0 ]; then
        echo "SAST gate FAILED: ${HIGH_COUNT} high/critical findings"
        exit 1
      fi
      echo "SAST gate PASSED"

security:sca:
  extends: .security_job
  image: aquasec/trivy:latest
  needs: []
  script:
    - mkdir -p ${REPORTS_DIR}
    - |
      trivy fs \
        --severity ${SEVERITY_THRESHOLD} \
        --format json \
        --output ${REPORTS_DIR}/sca-trivy.json \
        ${APP_NAME} || true
    # Gate decision
    - |
      CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' ${REPORTS_DIR}/sca-trivy.json 2>/dev/null || echo "0")
      HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' ${REPORTS_DIR}/sca-trivy.json 2>/dev/null || echo "0")
      echo "SCA Critical: ${CRITICAL_COUNT}, High: ${HIGH_COUNT}"
      if [ "${FAIL_ON_CRITICAL}" = "true" ] && [ "${CRITICAL_COUNT}" -gt 0 ]; then
        echo "SCA gate FAILED: ${CRITICAL_COUNT} critical vulnerabilities"
        exit 1
      fi
      echo "SCA gate PASSED"

security:secrets:
  extends: .security_job
  image: zricethezav/gitleaks:latest
  needs: []
  script:
    - mkdir -p ${REPORTS_DIR}
    - |
      gitleaks detect \
        --source . \
        --report-format json \
        --report-path ${REPORTS_DIR}/secrets-gitleaks.json \
        --exit-code 0 || true
    # Gate decision - ANY secret is a failure
    - |
      if [ -f ${REPORTS_DIR}/secrets-gitleaks.json ]; then
        SECRET_COUNT=$(jq 'length' ${REPORTS_DIR}/secrets-gitleaks.json 2>/dev/null || echo "0")
        echo "Secrets found: ${SECRET_COUNT}"
        if [ "${SECRET_COUNT}" -gt 0 ]; then
          echo "SECRETS gate FAILED: ${SECRET_COUNT} secrets detected"
          jq '.[].Description' ${REPORTS_DIR}/secrets-gitleaks.json
          exit 1
        fi
      fi
      echo "SECRETS gate PASSED"

# ===========================================================================
# Quality Stage - SonarQube (optional)
# ===========================================================================
quality:sonarqube:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  needs: [test:unit]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=${APP_NAME} \
        -Dsonar.sources=${APP_NAME}/src \
        -Dsonar.tests=${APP_NAME}/test \
        -Dsonar.javascript.lcov.reportPaths=${APP_NAME}/coverage/lcov.info \
        -Dsonar.qualitygate.wait=true
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never
  allow_failure: true

# ===========================================================================
# Package Stage - Build Container Image
# ===========================================================================
package:build-image:
  extends: .docker_job
  stage: package
  needs: [test:unit, security:sast, security:sca, security:secrets]
  script:
    - |
      docker build \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.title=${APP_NAME}" \
        -t ${IMAGE_NAME}:${CI_COMMIT_SHA} \
        -t ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} \
        ${APP_NAME}
    - mkdir -p ${REPORTS_DIR}
    - docker save ${IMAGE_NAME}:${CI_COMMIT_SHA} > ${REPORTS_DIR}/image.tar
  artifacts:
    paths:
      - ${REPORTS_DIR}/image.tar
    expire_in: 1 hour

package:scan-image:
  extends: .docker_job
  stage: package
  needs: [package:build-image]
  script:
    - docker load < ${REPORTS_DIR}/image.tar
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v ${CI_PROJECT_DIR}/${REPORTS_DIR}:/reports \
        aquasec/trivy:latest image \
          --severity ${SEVERITY_THRESHOLD} \
          --format json \
          --output /reports/image-scan.json \
          ${IMAGE_NAME}:${CI_COMMIT_SHA} || true
    # Gate decision
    - |
      CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' ${REPORTS_DIR}/image-scan.json 2>/dev/null || echo "0")
      echo "Image scan Critical vulnerabilities: ${CRITICAL_COUNT}"
      # Warning only for base image vulns
      if [ "${CRITICAL_COUNT}" -gt 0 ]; then
        echo "WARNING: ${CRITICAL_COUNT} critical vulnerabilities in image (base image may be affected)"
      fi

package:sbom:
  extends: .docker_job
  stage: package
  needs: [package:build-image]
  script:
    - docker load < ${REPORTS_DIR}/image.tar
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v ${CI_PROJECT_DIR}/${REPORTS_DIR}:/reports \
        anchore/syft:latest \
        ${IMAGE_NAME}:${CI_COMMIT_SHA} \
        -o cyclonedx-json=/reports/sbom.json
    - |
      COMPONENT_COUNT=$(jq '.components | length' ${REPORTS_DIR}/sbom.json 2>/dev/null || echo "0")
      echo "SBOM generated: ${COMPONENT_COUNT} components"
  artifacts:
    paths:
      - ${REPORTS_DIR}/sbom.json
    expire_in: 90 days

# ===========================================================================
# Sign Stage - Cosign Image Signing
# ===========================================================================
sign:image:
  extends: .docker_job
  stage: sign
  needs: [package:build-image, package:sbom]
  script:
    - docker load < ${REPORTS_DIR}/image.tar
    # Push to registry first
    - echo "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USER}" --password-stdin "${REGISTRY_URL}"
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHA}
    - docker push ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
    # Get digest
    - |
      DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_NAME}:${CI_COMMIT_SHA} | cut -d'@' -f2)
      echo "Image digest: ${DIGEST}"
      echo "${DIGEST}" > ${REPORTS_DIR}/digest.txt
    # Sign with Cosign
    - |
      if [ -n "${COSIGN_KEY}" ]; then
        apk add --no-cache cosign
        echo "${COSIGN_PASSWORD}" | cosign sign \
          --key "${COSIGN_KEY}" \
          --yes \
          ${IMAGE_NAME}@${DIGEST}
        echo "Image signed successfully"
        # Attach SBOM attestation
        cosign attest \
          --key "${COSIGN_KEY}" \
          --type cyclonedx \
          --predicate ${REPORTS_DIR}/sbom.json \
          --yes \
          ${IMAGE_NAME}@${DIGEST}
        echo "SBOM attestation attached"
      else
        echo "WARNING: COSIGN_KEY not set, skipping signing"
      fi
  artifacts:
    paths:
      - ${REPORTS_DIR}/digest.txt
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual

# ===========================================================================
# Publish Stage - Artifacts and Reports
# ===========================================================================
publish:artifacts:
  stage: publish
  needs: [package:sbom, sign:image]
  image: curlimages/curl:latest
  script:
    - echo "Publishing artifacts..."
    - |
      if [ -f ${REPORTS_DIR}/digest.txt ]; then
        DIGEST=$(cat ${REPORTS_DIR}/digest.txt)
        echo "Published image: ${IMAGE_NAME}@${DIGEST}"
      fi
    - echo "SBOM: ${REPORTS_DIR}/sbom.json"
    - echo "Scan reports available in artifacts"
  artifacts:
    paths:
      - ${REPORTS_DIR}/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ===========================================================================
# Deploy Stage - GitOps Promotion
# ===========================================================================
deploy:dev:
  stage: deploy
  image: alpine/git:latest
  needs: [sign:image]
  variables:
    TARGET_ENV: dev
    GITOPS_REPO: ${GITOPS_REPO_URL}
  script:
    - |
      if [ -z "${GITOPS_SSH_KEY}" ]; then
        echo "GITOPS_SSH_KEY not configured, skipping GitOps promotion"
        exit 0
      fi
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "${GITOPS_SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - DIGEST=$(cat ${REPORTS_DIR}/digest.txt)
    - |
      git clone ${GITOPS_REPO} gitops-repo
      cd gitops-repo
      # Update image digest in values file
      sed -i "s|digest:.*|digest: ${DIGEST}|g" gitops/env/${TARGET_ENV}/values-${APP_NAME}.yaml
      git config user.email "ci@gitlab.local"
      git config user.name "GitLab CI"
      git add .
      git commit -m "chore(${TARGET_ENV}): promote ${APP_NAME} to ${DIGEST:0:12}

      Pipeline: ${CI_PIPELINE_URL}
      Commit: ${CI_COMMIT_SHA}"
      git push
    - echo "Promoted to ${TARGET_ENV}: ${IMAGE_NAME}@${DIGEST}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

deploy:qa:
  stage: deploy
  extends: deploy:dev
  variables:
    TARGET_ENV: qa
  needs: [deploy:dev]
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:prod:
  stage: deploy
  extends: deploy:dev
  variables:
    TARGET_ENV: prod
  needs: [deploy:qa]
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
